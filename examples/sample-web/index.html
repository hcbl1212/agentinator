<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample App</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #0f766e, #134e4a);
        color: #f0fdfa;
      }
      main {
        text-align: center;
        padding: 3rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 2rem;
        color: #99f6e4;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #134e4a;
        background: #5eead4;
        border: 0;
        border-radius: 999px;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- The tiny target app the visual harness previews. An agent visibly
         editing this (change the heading, recolor the button) proves the
         see-the-UI loop end to end. -->
    <main>
      <h1 id="headline">Sample App</h1>
      <p id="tagline">The target the harness can see.</p>
      <button id="cta" type="button">Click me</button>
    </main>
    <script>
      // Emit console output so the harness's console capture has something to
      // show — the visual loop's runtime signal alongside the screenshot.
      console.info('[sample] app ready')
      console.warn('[sample] demo warning: nothing is actually wrong')
    </script>
  </body>
</html>
