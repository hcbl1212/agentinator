appId: com.hcbl1212.agentinator
productName: Agentinator
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# The Claude Agent SDK spawns a CLI subprocess, so keep it on the real
# filesystem rather than inside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/**
# node:sqlite is built in — nothing to rebuild against Electron's ABI.
npmRebuild: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Unsigned until a Developer ID cert exists (ad-hoc broke launch with the
  # unpacked SDK binary). A downloaded unsigned build reads as "damaged"; clear
  # quarantine to run it (see RELEASE.md). When CSC_LINK/CSC_KEY_PASSWORD are
  # provided in the release job, drop this line so electron-builder signs, and
  # add mac.notarize + the Apple secrets for a clean, warning-free download.
  identity: null
