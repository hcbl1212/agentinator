name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The fast gates don't touch Electron, so they run on a quick Ubuntu runner in
  # parallel with the macOS build+e2e job below.
  checks:
    name: Lint, typecheck, test (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Restore node_modules + the Electron binary; skip the whole install when
      # the lockfile is unchanged.
      - name: Cache dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/electron
            ~/Library/Caches/electron
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # lint + format + typecheck + test in parallel — finishes in test-bound
      # time, not the sum. Same gates as the pre-push hook.
      - name: Gates (lint, format, typecheck, test — parallel)
        run: npx lefthook run ci-checks

  # The e2e drives the built Electron app, so it needs macOS (the target
  # platform). It carries the build since the two are inseparable here.
  e2e:
    name: Build + e2e (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/electron
            ~/Library/Caches/electron
          key: ${{ runner.os }}-deps-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build
        run: npm run build

      - name: E2E (Playwright drives the built Electron app)
        run: npx playwright test
